name: Build STUDYFLOW Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. إعداد Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 4. استخراج ملفات المشروع
      - name: Extract source ZIP
        run: |
          unzip -o STUDYFLOW-Pro-Source.zip -d source
          cp -a source/. .

      # 5. تثبيت المكتبات
      - name: Install dependencies
        run: npm install

      # 6. بناء تطبيق الويب
      - name: Build web app
        run: npm run build

      # 7. إعداد Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # 8. تثبيت أدوات Android
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 9. إضافة منصة Android
      - name: Add Android platform
        run: npx cap add android

      # 10. مزامنة Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 11. بناء APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 12. رفع APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STUDYFLOW-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
